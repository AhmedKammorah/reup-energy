name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
  REPO: ${{ vars.ARTIFACT_REPO }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Build + push image
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPO/app:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image="$IMAGE" \
            --region="$REGION" \
            --platform=managed \
            --allow-unauthenticated \
            --port=3000 \
            --memory=1Gi --cpu=1 \
            --min-instances=0 --max-instances=5 \
            --service-account="${{ vars.RUNTIME_SA }}" \
            --add-cloudsql-instances="$PROJECT_ID:$REGION:${{ vars.CLOUDSQL_INSTANCE }}" \
            --set-secrets=PAYLOAD_SECRET=PAYLOAD_SECRET:latest,DATABASE_URI=DATABASE_URI:latest \
            --set-env-vars="NODE_ENV=production,NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL }},GCS_BUCKET=${{ vars.GCS_BUCKET }}"

      - name: Show service URL
        run: |
          gcloud run services describe "$SERVICE" --region="$REGION" --format="value(status.url)"
